[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription-service"
version = "0.1.0"
description = "Upload an audio or video file and get a transcription from an open-source Whisper model."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "pydantic-settings==2.15.0",
    "redis==8.1.0",
    "rq==2.12.0",
    "faster-whisper==1.2.1",
    # Transitive dependency of faster-whisper, pinned on purpose: faster-whisper 1.2.1 allows av>=11,
    # but av 19 removed the `metadata_errors` argument it uses, so decoding fails with a TypeError.
    "av==18.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",
    "fakeredis==2.39.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
